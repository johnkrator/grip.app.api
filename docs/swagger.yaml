basePath: /
definitions:
  gin.H:
    additionalProperties: {}
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.Transaction:
    properties:
      accountID:
        type: string
      amount:
        type: number
      category:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: string
      status:
        type: string
      timestamp:
        type: string
      type:
        $ref: '#/definitions/models.TransactionType'
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  models.TransactionType:
    enum:
    - DEPOSIT
    - WITHDRAWAL
    - TRANSFER
    - PAYMENT_SENT
    - PAYMENT_RECEIVED
    - FEE_CHARGED
    type: string
    x-enum-varnames:
    - Deposit
    - Withdrawal
    - Transfer
    - PaymentSent
    - PaymentReceived
    - FeeCharged
  request.ChangePasswordRequestDto:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  request.DepositRequest:
    properties:
      accountId:
        type: string
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      userId:
        type: string
    required:
    - accountId
    - amount
    - currency
    - userId
    type: object
  request.ForgotPasswordRequestDto:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.ResetPasswordRequestDto:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  request.TransferRequest:
    properties:
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      fromAccountId:
        type: string
      toAccountId:
        type: string
      userId:
        type: string
    required:
    - amount
    - currency
    - fromAccountId
    - toAccountId
    - userId
    type: object
  request.TransferResponse:
    properties:
      fromTransaction:
        $ref: '#/definitions/models.Transaction'
      toTransaction:
        $ref: '#/definitions/models.Transaction'
    type: object
  request.UpdateUserRequestDto:
    properties:
      address:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      incomeRange:
        type: string
      lastName:
        type: string
      occupation:
        type: string
      phoneNumber:
        type: string
      preferences:
        type: string
      riskTolerance:
        type: string
    type: object
  request.UserLoginRequestDto:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  request.UserRegistrationRequestDto:
    properties:
      address:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      incomeRange:
        type: string
      lastName:
        type: string
      occupation:
        type: string
      password:
        minLength: 8
        type: string
      phoneNumber:
        type: string
      preferences:
        type: string
      riskTolerance:
        type: string
    required:
    - address
    - dateOfBirth
    - email
    - firstName
    - incomeRange
    - lastName
    - occupation
    - password
    - phoneNumber
    - riskTolerance
    type: object
  request.WithdrawRequest:
    properties:
      accountId:
        type: string
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      userId:
        type: string
    required:
    - accountId
    - amount
    - currency
    - userId
    type: object
  response.AccountResponseDto:
    properties:
      accountNumber:
        type: string
      accountType:
        type: string
      balance:
        type: number
      currency:
        type: string
      status:
        type: string
    type: object
  response.ChangePasswordResponseDto:
    properties:
      message:
        type: string
    type: object
  response.FinancialOverviewResponseDto:
    properties:
      account:
        $ref: '#/definitions/response.AccountResponseDto'
      investments:
        items:
          $ref: '#/definitions/response.InvestmentResponseDto'
        type: array
      loans:
        items:
          $ref: '#/definitions/response.LoanResponseDto'
        type: array
      netWorth:
        type: number
      totalInvestmentValue:
        type: number
      totalLoanAmount:
        type: number
      user:
        $ref: '#/definitions/response.UserResponseDto'
    type: object
  response.ForgotPasswordResponseDto:
    properties:
      message:
        type: string
    type: object
  response.InvestmentResponseDto:
    properties:
      amount:
        type: number
      currentValue:
        type: number
      id:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  response.LoanResponseDto:
    properties:
      amount:
        type: number
      id:
        type: string
      interestRate:
        type: number
      purpose:
        type: string
      status:
        type: string
      term:
        type: string
    type: object
  response.ResetPasswordResponseDto:
    properties:
      message:
        type: string
    type: object
  response.Role:
    enum:
    - admin
    - manager
    - employee
    - customer
    type: string
    x-enum-varnames:
    - AdminRole
    - ManagerRole
    - EmployeeRole
    - CustomerRole
  response.TransactionResponseDto:
    properties:
      accountId:
        type: string
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        type: string
      timestamp:
        type: string
      type:
        type: string
      userId:
        type: string
    type: object
  response.UserLoginResponseDto:
    properties:
      accessToken:
        type: string
      address:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      isAdmin:
        type: boolean
      isDeleted:
        type: boolean
      isVerified:
        type: boolean
      lastName:
        type: string
      phoneNumber:
        type: string
      refreshToken:
        type: string
      role:
        $ref: '#/definitions/response.Role'
    type: object
  response.UserProfileResponseDto:
    properties:
      incomeRange:
        type: string
      occupation:
        type: string
      preferences:
        type: string
      riskTolerance:
        type: string
    type: object
  response.UserRegistrationResponseDto:
    properties:
      account:
        $ref: '#/definitions/response.AccountResponseDto'
      address:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      phoneNumber:
        type: string
      profile:
        $ref: '#/definitions/response.UserProfileResponseDto'
      role:
        $ref: '#/definitions/response.Role'
    type: object
  response.UserResponseDto:
    properties:
      address:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      isVerified:
        type: boolean
      lastName:
        type: string
      phoneNumber:
        type: string
      profile:
        $ref: '#/definitions/response.UserProfileResponseDto'
      role:
        $ref: '#/definitions/response.Role'
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a Grip service API.
  title: Grip API
  version: "1.0"
paths:
  /:
    get:
      description: Get a welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Welcome message
      tags:
      - welcome
  /change-password:
    post:
      consumes:
      - application/json
      description: Change the authenticated user's password
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Change password information
        in: body
        name: changePasswordInfo
        required: true
        schema:
          $ref: '#/definitions/request.ChangePasswordRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ChangePasswordResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Change user's password
      tags:
      - users
  /current-user:
    get:
      consumes:
      - application/json
      description: Get the current user
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/response.UserLoginResponseDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
      summary: Get current user
      tags:
      - users
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password reset email to the user
      parameters:
      - description: User's email
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/request.ForgotPasswordRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ForgotPasswordResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Initiate password reset
      tags:
      - users
  /login:
    post:
      consumes:
      - application/json
      description: Login a user with the provided credentials
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/request.UserLoginRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserLoginResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
      summary: Login a user
      tags:
      - users
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user with the input payload
      parameters:
      - description: Register user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.UserRegistrationRequestDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.UserRegistrationResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Register a new user
      tags:
      - users
  /reset-password:
    post:
      consumes:
      - application/json
      description: Reset the user's password using the provided token
      parameters:
      - description: Reset password information
        in: body
        name: resetInfo
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResetPasswordResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Reset user's password
      tags:
      - users
  /transactions/deposit:
    post:
      consumes:
      - application/json
      description: Deposit funds into a user's account
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Deposit request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TransactionResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Deposit funds
      tags:
      - transactions
  /transactions/transfer:
    post:
      consumes:
      - application/json
      description: Transfer funds between two accounts
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Transfer request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.TransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/request.TransferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Transfer funds
      tags:
      - transactions
  /transactions/withdraw:
    post:
      consumes:
      - application/json
      description: Withdraw funds from a user's account
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Withdraw request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.WithdrawRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TransactionResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Withdraw funds
      tags:
      - transactions
  /users:
    get:
      consumes:
      - application/json
      description: Get all users
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Users
          schema:
            $ref: '#/definitions/response.UserLoginResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Get all users
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete the user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Delete user
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Get a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "2":
          description: User
          schema:
            $ref: '#/definitions/response.UserLoginResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Get user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's information
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Update user information
        in: body
        name: updateInfo
        required: true
        schema:
          $ref: '#/definitions/request.UpdateUserRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Update user information
      tags:
      - users
  /users/{id}/financial-overview:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's financial overview
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FinancialOverviewResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Get user financial overview
      tags:
      - users
